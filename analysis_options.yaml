analyzer:
  exclude:
    - .toolchain/**
    - '**/*.g.dart'
    - evidence/**
    - archive/**
    - docs/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    invalid_use_of_visible_for_testing_member: error
linter:
  rules:
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures
    - use_build_context_synchronously
