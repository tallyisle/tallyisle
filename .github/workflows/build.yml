name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  verify:
    name: Format, Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Run unit, data & widget tests
        run: flutter test

  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Configure Android keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          fi

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Android Release APK
        run: |
          flutter build apk --release --target-platform android-arm64 --tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk TallyIsle-Android-release.apk

      - name: Build Android Debug APK
        run: |
          flutter build apk --debug --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-debug.apk TallyIsle-Android-debug.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TallyIsle-Android-APK
          path: |
            TallyIsle-Android-release.apk
            TallyIsle-Android-debug.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows x64 installers (EXE, MSI, portable ZIP)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tool/packaging/windows/package_windows.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TallyIsle-Windows-x64
          path: |
            TallyIsle-Windows-x64-setup.exe
            TallyIsle-Windows-x64.msi
            TallyIsle-Windows-x64-portable.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev build-essential rpm flatpak flatpak-builder file desktop-file-utils
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package Linux x64 installers (DEB, RPM, AppImage, Flatpak, portable TAR.GZ)
        run: bash tool/packaging/linux/package_linux.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TallyIsle-Linux-x64
          path: |
            TallyIsle-Linux-x64.deb
            TallyIsle-Linux-x64.rpm
            TallyIsle-Linux-x64.AppImage
            TallyIsle-Linux-x64.flatpak
            TallyIsle-Linux-x64-portable.tar.gz
          if-no-files-found: error

  build-apple:
    name: Build macOS & iOS
    runs-on: macos-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Sign & package macOS installers (DMG, PKG, portable ZIP)
        run: bash tool/packaging/macos/package_macos.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TallyIsle-macOS
          path: |
            TallyIsle-macOS.dmg
            TallyIsle-macOS.pkg
            TallyIsle-macOS-portable.zip
          if-no-files-found: error

      - name: Build iOS Release (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry TallyIsle-iOS-unsigned.ipa Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TallyIsle-iOS-Unsigned
          path: TallyIsle-iOS-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-android
      - build-windows
      - build-linux
      - build-apple
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Generate SHA-256 checksums
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
