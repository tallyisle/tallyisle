name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  verify:
    name: Format, Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Run unit, data & widget tests
        run: flutter test

  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Configure Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          REQUIRE_FIXED_KEYSTORE: ${{ github.repository == 'tallyisle/tallyisle' && github.event_name != 'pull_request' }}
          EXPECTED_SHA256: '21:6E:EE:81:15:50:F8:7E:E3:0B:C1:88:C4:34:49:B4:67:75:5B:0A:EB:4E:3C:F6:03:EE:B4:BF:7E:ED:64:C3'
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$HOME/.android/debug.keystore"
            ACTUAL_KEYSTORE_SHA256="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1)"
            if [ "$ACTUAL_KEYSTORE_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "::error::Decoded ANDROID_KEYSTORE_BASE64 SHA-256 ($ACTUAL_KEYSTORE_SHA256) does not match expected ($EXPECTED_SHA256)."
              exit 1
            fi
            echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
            echo "VERIFY_ANDROID_SIGNING=1" >> "$GITHUB_ENV"
          elif [ "$REQUIRE_FIXED_KEYSTORE" = "true" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty on official tallyisle/tallyisle non-PR build. Refusing to fall back to an ephemeral debug keystore."
            exit 1
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 not set (PR/fork build); using default ephemeral debug keystore."
          fi

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Android arm64 Release APK
        run: |
          flutter build apk --release --target-platform android-arm64 --tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk TallyIsle-Android-arm64-release.apk

      - name: Build Android arm64 Debug APK
        run: |
          flutter build apk --debug --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-debug.apk TallyIsle-Android-arm64-debug.apk

      - name: Build Android x64 Release APK
        run: |
          flutter build apk --release --target-platform android-x64 --tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk TallyIsle-Android-x64-release.apk

      - name: Build Android x64 Debug APK
        run: |
          flutter build apk --debug --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-debug.apk TallyIsle-Android-x64-debug.apk

      - name: Verify Android APK ABI isolation
        run: |
          python3 - <<'PY'
          import sys
          import zipfile

          checks = [
              ("TallyIsle-Android-arm64-release.apk", "lib/arm64-v8a/", "lib/x86_64/"),
              ("TallyIsle-Android-arm64-debug.apk", "lib/arm64-v8a/", "lib/x86_64/"),
              ("TallyIsle-Android-x64-release.apk", "lib/x86_64/", "lib/arm64-v8a/"),
              ("TallyIsle-Android-x64-debug.apk", "lib/x86_64/", "lib/arm64-v8a/"),
          ]
          for apk, expected_prefix, forbidden_prefix in checks:
              with zipfile.ZipFile(apk, "r") as zf:
                  names = zf.namelist()
              if not any(name.startswith(expected_prefix) for name in names):
                  print(
                      f"::error::{apk} is missing expected ABI entries under {expected_prefix}",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              if any(name.startswith(forbidden_prefix) for name in names):
                  print(
                      f"::error::{apk} unexpectedly contains forbidden ABI entries under {forbidden_prefix}",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              print(f"OK {apk}: has {expected_prefix}, no {forbidden_prefix}")
          PY

      - name: Verify Android APK signing fingerprint
        if: env.VERIFY_ANDROID_SIGNING == '1'
        env:
          EXPECTED_SHA256: '21:6E:EE:81:15:50:F8:7E:E3:0B:C1:88:C4:34:49:B4:67:75:5B:0A:EB:4E:3C:F6:03:EE:B4:BF:7E:ED:64:C3'
        run: |
          set -euo pipefail
          EXPECTED_SHA256_HEX="$(printf '%s' "$EXPECTED_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -name apksigner \( -type f -o -type l \) 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $SDK_ROOT/build-tools; cannot verify APK v2/v3 signing certificate."
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"
          for apk in \
            TallyIsle-Android-arm64-release.apk \
            TallyIsle-Android-arm64-debug.apk \
            TallyIsle-Android-x64-release.apk \
            TallyIsle-Android-x64-debug.apk; do
            VERIFY_OUT="$("$APKSIGNER" verify --print-certs "$apk")"
            printf '%s\n' "$VERIFY_OUT"
            SIGNER_DIGESTS="$(printf '%s\n' "$VERIFY_OUT" | grep -v '^Source Stamp' | sed -n 's/^.*certificate SHA-256 digest:[[:space:]]*//p' | tr -d ':\r ' | tr '[:upper:]' '[:lower:]' | sort -u)"
            echo "$apk -> Signer SHA-256: $SIGNER_DIGESTS"
            if [ -z "$SIGNER_DIGESTS" ]; then
              echo "::error::$apk produced no signer SHA-256 digest lines from apksigner."
              exit 1
            fi
            while IFS= read -r digest; do
              if [ "$digest" != "$EXPECTED_SHA256_HEX" ]; then
                echo "::error::$apk signing SHA-256 ($digest) does not match expected ($EXPECTED_SHA256_HEX)."
                exit 1
              fi
            done <<< "$SIGNER_DIGESTS"
          done

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TallyIsle-Android-APK
          path: |
            TallyIsle-Android-arm64-release.apk
            TallyIsle-Android-arm64-debug.apk
            TallyIsle-Android-x64-release.apk
            TallyIsle-Android-x64-debug.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter (x64)
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Set up Flutter (arm64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          git clone --depth 1 --branch ${{ env.FLUTTER_VERSION }} https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          git -C "$env:RUNNER_TEMP\flutter" checkout -b stable
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$env:RUNNER_TEMP\flutter\bin;$env:PATH"
          flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows ${{ matrix.arch }} installers (EXE, MSI, portable ZIP)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tool/packaging/windows/package_windows.ps1 -Arch ${{ matrix.arch }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TallyIsle-Windows-${{ matrix.arch }}
          path: |
            TallyIsle-Windows-${{ matrix.arch }}-setup.exe
            TallyIsle-Windows-${{ matrix.arch }}.msi
            TallyIsle-Windows-${{ matrix.arch }}-portable.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev build-essential rpm flatpak flatpak-builder file desktop-file-utils
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Set up Flutter (x64)
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Set up Flutter (arm64)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 --branch ${{ env.FLUTTER_VERSION }} https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout -b stable
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          flutter --version

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package Linux ${{ matrix.arch }} installers (DEB, RPM, AppImage, Flatpak, portable TAR.GZ)
        run: bash tool/packaging/linux/package_linux.sh --arch ${{ matrix.arch }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TallyIsle-Linux-${{ matrix.arch }}
          path: |
            TallyIsle-Linux-${{ matrix.arch }}.deb
            TallyIsle-Linux-${{ matrix.arch }}.rpm
            TallyIsle-Linux-${{ matrix.arch }}.AppImage
            TallyIsle-Linux-${{ matrix.arch }}.flatpak
            TallyIsle-Linux-${{ matrix.arch }}-portable.tar.gz
          if-no-files-found: error

  build-apple:
    name: Build macOS & iOS
    runs-on: macos-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Sign & package macOS installers (DMG, PKG, portable ZIP)
        run: bash tool/packaging/macos/package_macos.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TallyIsle-macOS
          path: |
            TallyIsle-macOS.dmg
            TallyIsle-macOS.pkg
            TallyIsle-macOS-portable.zip
          if-no-files-found: error

      - name: Build iOS Release (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry TallyIsle-iOS-unsigned.ipa Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TallyIsle-iOS-Unsigned
          path: TallyIsle-iOS-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-android
      - build-windows
      - build-linux
      - build-apple
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: List and verify all 24 platform release assets
        run: |
          set -euo pipefail
          ls -lh dist/
          for asset in \
            TallyIsle-Android-arm64-release.apk \
            TallyIsle-Android-arm64-debug.apk \
            TallyIsle-Android-x64-release.apk \
            TallyIsle-Android-x64-debug.apk \
            TallyIsle-Windows-x64-setup.exe \
            TallyIsle-Windows-x64.msi \
            TallyIsle-Windows-x64-portable.zip \
            TallyIsle-Windows-arm64-setup.exe \
            TallyIsle-Windows-arm64.msi \
            TallyIsle-Windows-arm64-portable.zip \
            TallyIsle-Linux-x64.deb \
            TallyIsle-Linux-x64.rpm \
            TallyIsle-Linux-x64.AppImage \
            TallyIsle-Linux-x64.flatpak \
            TallyIsle-Linux-x64-portable.tar.gz \
            TallyIsle-Linux-arm64.deb \
            TallyIsle-Linux-arm64.rpm \
            TallyIsle-Linux-arm64.AppImage \
            TallyIsle-Linux-arm64.flatpak \
            TallyIsle-Linux-arm64-portable.tar.gz \
            TallyIsle-macOS.dmg \
            TallyIsle-macOS.pkg \
            TallyIsle-macOS-portable.zip \
            TallyIsle-iOS-unsigned.ipa; do
            if [ ! -s "dist/$asset" ]; then
              echo "::error::Missing or empty release asset: dist/$asset"
              exit 1
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Merge and upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MERGE_WORK="$RUNNER_TEMP/checksums"
          mkdir -p "$MERGE_WORK"
          LOCAL_SUMS="$MERGE_WORK/local.txt"
          EXISTING_SUMS="$MERGE_WORK/existing.txt"

          (
            cd dist
            shopt -s nullglob
            files=()
            for f in *; do
              if [ -f "$f" ] && [ "$f" != "SHA256SUMS.txt" ]; then
                files+=("$f")
              fi
            done
            if [ "${#files[@]}" -eq 0 ]; then
              echo "::error::No release assets found in dist/."
              exit 1
            fi
            sha256sum "${files[@]}" > "$LOCAL_SUMS"
          )

          uploaded=0
          for attempt in 1 2 3; do
            rm -f "$EXISTING_SUMS" "$MERGE_WORK/SHA256SUMS.txt"
            if gh release download "${GITHUB_REF_NAME}" \
                --pattern 'SHA256SUMS.txt' \
                --output "$EXISTING_SUMS" \
                --clobber 2>/dev/null; then
              echo "Downloaded existing SHA256SUMS.txt (attempt ${attempt})."
            else
              echo "No existing SHA256SUMS.txt on release ${GITHUB_REF_NAME} yet (attempt ${attempt})."
              rm -f "$EXISTING_SUMS"
            fi

            python3 - "$EXISTING_SUMS" "$LOCAL_SUMS" "$MERGE_WORK/SHA256SUMS.txt" <<'PY'
          import pathlib
          import sys

          existing_path, local_path, out_path = map(pathlib.Path, sys.argv[1:4])
          entries = {}
          for path in (existing_path, local_path):
              if not path.is_file():
                  continue
              for raw in path.read_text(encoding='utf-8').splitlines():
                  line = raw.strip()
                  if not line:
                      continue
                  parts = line.split(None, 1)
                  if len(parts) != 2:
                      continue
                  digest, name = parts[0], parts[1].lstrip('*')
                  if name.startswith('./'):
                      name = name[2:]
                  if name == 'SHA256SUMS.txt':
                      continue
                  entries[name] = digest

          with out_path.open('w', encoding='utf-8', newline='\n') as f:
              for name in sorted(entries):
                  f.write(f'{entries[name]}  {name}\n')
          PY

            cp "$MERGE_WORK/SHA256SUMS.txt" SHA256SUMS.txt
            if gh release upload "${GITHUB_REF_NAME}" SHA256SUMS.txt --clobber; then
              uploaded=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              backoff=$((attempt * 5))
              echo "::warning::gh release upload failed (attempt ${attempt}/3), retrying in ${backoff}s..."
              sleep "$backoff"
            fi
          done

          if [ "$uploaded" -ne 1 ]; then
            echo "::error::Failed to upload merged SHA256SUMS.txt after 3 attempts."
            exit 1
          fi
          cat SHA256SUMS.txt
