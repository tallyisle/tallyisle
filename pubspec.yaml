name: tallyisle
description: 帐屿 / TallyIsle — evidence-led Flutter rebuild, development profile.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.1.0
  drift: 2.35.2
  sqlite3: 3.7.1
  path_provider: 2.1.6
  path: 1.9.1
  uuid: 4.6.0
  crypto: 3.0.7
  file_selector: 1.1.0
  cupertino_icons: 1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  drift_dev: 2.35.1
  build_runner: 2.16.2
flutter:
  uses-material-design: true
  assets:
    - assets/branding/tallyisle-logo-original.png
