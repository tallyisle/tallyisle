name: tallyisle
description: 帐屿 / TallyIsle — 本地优先、精确到分的个人记账与资产管理工具。
publish_to: none
version: 0.1.0-rc+1
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.1.0
  drift: 2.35.2
  sqlite3: 3.7.1
  path_provider: 2.1.6
  path: 1.9.1
  uuid: 4.6.0
  crypto: 3.0.7
  file_selector: 1.1.0
  cupertino_icons: 1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  drift_dev: 2.35.1
  build_runner: 2.16.2
flutter:
  uses-material-design: true
  assets:
    - assets/branding/tallyisle-logo-original.png

dependency_overrides:
  code_assets:
    path: third_party/ohos_packages/code_assets
  cupertino_ui:
    path: third_party/ohos_packages/cupertino_ui
  material_ui:
    path: third_party/ohos_packages/material_ui
  path_provider:
    path: third_party/ohos_packages/path_provider
  path_provider_ohos:
    path: third_party/ohos_packages/path_provider_ohos
  file_selector:
    path: third_party/ohos_packages/file_selector
  file_selector_ohos:
    path: third_party/ohos_packages/file_selector_ohos

hooks:
  user_defines:
    sqlite3:
      source:
        ohos: system
        default: sqlite3
